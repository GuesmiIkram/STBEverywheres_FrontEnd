<div class="reclamation-container">
  <div class="reclamation-header">
    <h2 class="title">
       Formulaire de Réclamation
    </h2>
    <div class="icon-container">
      <i class="bi bi-file-text"></i>
    </div>
  </div>

  <div class="instruction-box">
    <p>Veuillez remplir le formulaire ci-dessous le plus clairement possible pour nous permettre de traiter votre réclamation dans les meilleurs délais.</p>
  </div>

  <form [formGroup]="reclamationForm" (ngSubmit)="onSubmit()" class="reclamation-form">
    <!-- Champ Objet -->
    <div class="form-group">
      <label for="objet">
        <i class="bi bi-card-heading"></i> Objet de la réclamation <span class="required">*</span>
      </label>
      <input
        type="text"
        id="objet"
        formControlName="objet"
        placeholder="Ex: Problème de virement"
        class="form-control"
      >
      <div *ngIf="reclamationForm.get('objet')?.invalid && reclamationForm.get('objet')?.touched"
           class="error-message">
        Ce champ est obligatoire
      </div>
    </div>

    <!-- Champ Motif -->
    <div class="form-group">
      <label for="motif">
        <i class="bi bi-question-circle"></i> Motif de la réclamation <span class="required">*</span>
      </label>
      <select
        id="motif"
        formControlName="motif"
        class="form-control"
      >
        <option value="" disabled selected>Sélectionnez un motif...</option>
        <option value="mise en opposition chequier">Mise en opposition chéquier</option>
        <option value="mise en opposition carte">mise en opposition carte</option>
        <option value="frais erronées">Frais erronés</option>
        <option value="opération double">Opération double</option>
        <option value="autre">Autre</option>
      </select>
      <div *ngIf="reclamationForm.get('motif')?.invalid && reclamationForm.get('motif')?.touched"
           class="error-message">
        Ce champ est obligatoire
      </div>
    </div>

    <!-- Champ Description -->
    <div class="form-group">
      <label for="message">
        <i class="bi bi-text-paragraph"></i> Description détaillée <span class="required">*</span>
      </label>
      <textarea
        id="message"
        formControlName="message"
        rows="5"
        placeholder="Décrivez votre problème en détail..."
        class="form-control"
      ></textarea>
      <div *ngIf="reclamationForm.get('message')?.invalid && reclamationForm.get('message')?.touched"
           class="error-message">
        Ce champ est obligatoire
      </div>
    </div>

    <!-- Bouton Soumettre -->
    <div class="form-footer">
      <button
        type="submit"
        class="submit-btn"
        [disabled]="!reclamationForm.valid || isLoading"
      >
        <span *ngIf="!isLoading">
          <i class="bi bi-send"></i> Envoyer la réclamation
        </span>
        <span *ngIf="isLoading">
          <i class="bi bi-hourglass"></i> Envoi en cours...
        </span>
      </button>
    </div>
  </form>
</div>

<div class="rib-container">
  <h2 class="title">
    <i class="bi bi-file-earmark-pdf"></i> Téléchargement d'extrait
  </h2>

  <div class="form-group">
    <label for="compteSelection">
      <i class="bi bi-bank"></i> Sélectionnez un compte *
    </label>
    <select
      id="compteSelection"
      [(ngModel)]="selectedCompte"
      class="form-control"
      [disabled]="isLoadingComptes"
    >
      <option value="" disabled selected>Choisissez un compte...</option>
      <option *ngFor="let compte of comptes" [value]="compte.rib">
        {{ compte.rib }} - {{ compte.type }}
      </option>
    </select>

  </div>
  <div class="form-row">
    <div class="form-group">
      <label for="dateDebut">
        <i class="bi bi-calendar-event"></i> Date de début *
      </label>
      <input
        id="dateDebut"
        type="date"
        class="form-control"
        [(ngModel)]="dateDebut"
        [max]="dateFin || today"
        required
      />
    </div>

    <div class="form-group">
      <label for="dateFin">
        <i class="bi bi-calendar-check"></i> Date de fin *
      </label>
      <input
        id="dateFin"
        type="date"
        class="form-control"
        [(ngModel)]="dateFin"
        [min]="dateDebut"
        [max]="today"
        required
      />
    </div>
  </div>

  <div class="action-buttons">
    <button
      class="btn preview-btn"
      (click)="previewExtrait()"
      [disabled]="!selectedCompte || isDownloading"
    >
      <span *ngIf="!isDownloading">
        <i class="bi bi-eye"></i> Visualiser l'extrait
      </span>
      <span *ngIf="isDownloading">
        <i class="bi bi-hourglass"></i> Chargement...
      </span>
    </button>

    <button
      class="btn download-btn"
      (click)="downloadExtrait()"
      [disabled]="!selectedCompte || isDownloading"
    >
      <span *ngIf="!isDownloading">
        <i class="bi bi-download"></i> Télécharger l'extrait
      </span>
      <span *ngIf="isDownloading">
        <i class="bi bi-hourglass"></i> Téléchargement en cours...
      </span>
    </button>
  </div>

  <!-- Zone d'affichage du PDF - Ajoutée ici -->
  <div *ngIf="showPdfViewer && pdfUrl" class="pdf-preview-container">
    <button class="close-preview" (click)="closePreview()">
      <i class="bi bi-x"></i>
    </button>
    <iframe [src]="pdfUrl" frameborder="0"></iframe>
  </div>

  <div *ngIf="errorMessage" class="error-message">
    <i class="bi bi-exclamation-triangle"></i> {{ errorMessage }}
  </div>
</div>

<div class="verification-container">
  <div ngIf="verificationStatus === 'pending'" class="verification-pending">
    <div class="spinner"></div>
    <p>Vérification de votre email en cours...</p>
  </div>

  <divngIf="verificationStatus === 'success'" class="verification-success">
    <div class="success-icon">✓</div>
    <h2>Votre email a été vérifié avec succès!</h2>
    <p>Vous allez être redirigé vers la page de connexion.</p>
  </div>

  <div *ngIf="verificationStatus === 'error'" class="verification-error">
    <div class="error-icon">✗</div>
    <h2>Erreur lors de la vérification</h2>
    <p>{{errorMessage}}</p>
    <button class="btn btn-primary" (click)="navigateToLogin()">
      Retour à la page de connexion
    </button>
  </div>
</div>
